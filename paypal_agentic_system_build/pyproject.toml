[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paypal-agentic-system"
version = "0.1.1"
description = "Agentic PayPal API system with retrieval, MCP, workflow orchestration, and mocked smoke tests."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-groq>=1.1,<2",
  "fastmcp>=4.0,<5",
  "mcp>=2.0,<3",
  "numpy>=1.26,<3",
  "sentence-transformers>=3.0,<6",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<10",
  "pytest-asyncio>=0.23,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
markers = ["slow: spawns subprocesses or hits the network"]
